name: check

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: true

jobs:
  fast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - uses: mizchi/pkfire@a171b300d8efa033f08bbeda9df5994e545b14f5 # v0.11.0
        with:
          version: v0.11.0
          pkl-version: 0.31.1

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.pkl/cache
            ~/.cache/pkfire-mbt
          key: ${{ runner.os }}-dspec-pkf-${{ hashFiles('PklProject', 'Taskfile.pkl', 'pnpm-lock.yaml', 'tsconfig.json', 'tsconfig.build.json', 'dspec/**/*.pkl', 'pkl-tests/**/*.pkl', 'src/**/*.mjs', 'src/**/*.mts', 'test/**/*.mjs', 'test/**/*.ts', 'fixtures/**/*') }}
          restore-keys: |
            ${{ runner.os }}-dspec-pkf-

      - run: pnpm install --frozen-lockfile
      - run: pkf run check:fast

  formal:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3.21.5
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - run: nix develop path:$PWD -c pkf run check:formal
