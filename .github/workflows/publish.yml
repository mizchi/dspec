name: publish

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.33.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: mizchi/pkfire@a171b300d8efa033f08bbeda9df5994e545b14f5 # v0.11.0
        with:
          version: v0.11.0
          pkl-version: 0.31.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run package:smoke
      - run: pkl project package --skip-publish-check --output-path dist/pkl
      - run: gh release view pkl >/dev/null 2>&1 || gh release create pkl --title "Pkl package index" --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release upload pkl dist/pkl/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm publish
