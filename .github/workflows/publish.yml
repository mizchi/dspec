name: publish

# Pushing a v<version> tag publishes that version. npm trusts this workflow by
# filename, so renaming it requires registering the trusted publisher again:
#   npm trust github @mizchi/dspec --repo mizchi/dspec --file publish.yml --allow-publish -y
# There is no npm token: npm authenticates through OIDC and attaches provenance.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub releases (the tag release and the pkl package index)
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.33.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: mizchi/pkfire@a171b300d8efa033f08bbeda9df5994e545b14f5 # v0.11.0
        with:
          version: v0.11.0
          pkl-version: 0.31.1

      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json is $version, tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run package:smoke
      - run: pkl project package --skip-publish-check --output-path dist/pkl
      - run: gh release view pkl >/dev/null 2>&1 || gh release create pkl --title "Pkl package index" --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release upload pkl dist/pkl/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11
      - name: Publish to npm
        run: |
          version=${GITHUB_REF_NAME#v}
          case "$version" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac

      - name: GitHub release from the changelog
        run: |
          version=${GITHUB_REF_NAME#v}
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          awk -v h="## $version" '$0 == h || index($0, h" ") == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md 2>/dev/null || true
          if grep -q '[^[:space:]]' notes.md; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $prerelease
          fi
        env:
          GH_TOKEN: ${{ github.token }}
