apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: production
spec:
  replicas: 3
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: production
spec:
  selector:
    app: payments-api
---
apiVersion: v1
kind: Secret
metadata:
  name: payments-api-secrets
  namespace: production
type: Opaque
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-reconcile
  namespace: production
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec: {}
